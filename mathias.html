<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Team Europe · Mathias</title>
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Europe">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230a1020'/%3E%3Ctext x='90' y='120' font-size='96' text-anchor='middle' fill='%23e6c874' font-family='Georgia'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#0a1020; --ink0:#070b16; --surf:#121b36; --surf2:#0e1730; --raise:#16213f;
    --line:#26315c; --gold:#e6c874; --gold2:#c9a44c; --goldline:rgba(230,200,116,.30);
    --ivory:#f4efe2; --dim:#c7cfe2; --mut:#8f9cc0; --blue:#5a9bf0; --water:#3f83bd;
    --under:#63cd90; --over:#eb736e; --shadow:0 18px 40px -20px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ivory);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;line-height:1.5;overflow-x:hidden;
    background-image:radial-gradient(120% 80% at 50% -10%, #16213f 0%, var(--bg) 55%);
    background-attachment:fixed}
  .lab{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:600}
  .num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-weight:800}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
  .screen{display:none;min-height:100dvh;flex-direction:column}
  .screen.on{display:flex}
  .pad{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

  /* ---------- START ---------- */
  #start{padding-top:max(48px,calc(env(safe-area-inset-top) + 34px));padding-bottom:40px}
  .crest{text-align:center;color:var(--gold);font-family:"Oswald";letter-spacing:.34em;font-size:11px;font-weight:500;opacity:.9}
  .word{text-align:center;font-family:"Oswald";font-weight:700;letter-spacing:.06em;
    font-size:clamp(38px,12vw,52px);line-height:1;margin:12px 0 4px;color:var(--ivory)}
  .word em{color:var(--gold);font-style:normal}
  .word2{text-align:center;font-family:"Oswald";text-transform:uppercase;letter-spacing:.32em;
    font-size:13px;color:var(--mut);font-weight:500}
  .hair{height:1px;background:linear-gradient(90deg,transparent,var(--goldline),transparent);margin:26px 0 22px}
  .pgrid{display:flex;flex-direction:column;gap:11px}
  .pcard{display:flex;align-items:center;gap:15px;background:linear-gradient(180deg,var(--surf),var(--surf2));
    border:1px solid var(--line);border-radius:16px;padding:16px 17px;text-align:left;
    transition:transform .12s ease,border-color .2s;box-shadow:var(--shadow)}
  .pcard:active{transform:scale(.985);border-color:var(--goldline)}
  .pini{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;
    font-family:"Oswald";font-weight:700;font-size:19px;color:var(--ink0);
    background:linear-gradient(150deg,var(--gold),var(--gold2))}
  .pini.t{background:linear-gradient(150deg,#7fb0f2,#3f6fc4)}
  .pini.g{background:linear-gradient(150deg,#aeb7d4,#5f6a8e)}
  .pname{flex:1}
  .pname b{font-family:"Hanken Grotesk";font-weight:700;font-size:17px;display:block;letter-spacing:.01em}
  .pname span{font-size:12.5px;color:var(--mut);font-family:"Oswald";letter-spacing:.08em;text-transform:uppercase}
  .phcp{font-family:"Archivo";font-weight:800;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
  .phcp small{display:block;font-family:"Oswald";font-size:9px;letter-spacing:.16em;color:var(--mut);text-align:right;font-weight:500;margin-top:-2px}
  .startfoot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:24px;line-height:1.7}

  /* ---------- HOME ---------- */
  #home{padding-top:max(46px,calc(env(safe-area-inset-top) + 30px));padding-bottom:34px;justify-content:flex-start}
  .hi{font-family:"Oswald";text-transform:uppercase;letter-spacing:.2em;color:var(--mut);font-size:12px;font-weight:500}
  .hname{font-family:"Oswald";font-weight:700;font-size:clamp(30px,9vw,40px);line-height:1.05;margin:5px 0 10px}
  .role{display:inline-flex;align-items:center;gap:7px;font-family:"Oswald";text-transform:uppercase;
    letter-spacing:.12em;font-size:12px;font-weight:600;padding:6px 13px;border-radius:30px;border:1px solid var(--line)}
  .role.a{color:#f2c98e;border-color:rgba(230,180,120,.4)} .role.t{color:#8fb8f2;border-color:rgba(90,155,240,.38)}
  .role.g{color:#aeb9d8;border-color:rgba(150,165,210,.4)}
  .rdesc{color:var(--dim);font-size:14.5px;margin:16px 0 6px;max-width:46ch}
  .chcp{margin-top:11px;font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--gold)}
  .chcp b{font-weight:700}
  .manifesto{background:linear-gradient(180deg,var(--surf),var(--surf2));border:1px solid var(--goldline);
    border-radius:16px;padding:17px 18px;margin:20px 0 4px;box-shadow:var(--shadow)}
  .manifesto h3{font-family:"Oswald";text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--gold);margin-bottom:10px}
  .manifesto p{font-size:14px;color:var(--dim);margin-bottom:11px;line-height:1.55}
  .manifesto ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .manifesto li{font-size:14px;padding-left:19px;position:relative;line-height:1.5}
  .manifesto li::before{content:"◆";position:absolute;left:0;top:3px;color:var(--gold);font-size:9px}
  .manifesto li b{color:var(--ivory)}
  .manifesto .kick{color:var(--gold);font-family:"Oswald";text-transform:uppercase;letter-spacing:.08em;
    font-weight:700;font-size:13px;margin:13px 0 0}
  .course{display:flex;gap:10px;margin:22px 0 8px}
  .cstat{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
  .cstat .k{font-family:"Oswald";text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--mut);font-weight:500}
  .cstat .v{font-family:"Archivo";font-weight:800;font-size:20px;margin-top:2px}
  .big-btn{display:block;width:100%;text-align:center;font-family:"Oswald";text-transform:uppercase;
    letter-spacing:.16em;font-weight:700;font-size:17px;color:var(--ink0);
    background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:15px;padding:19px;
    box-shadow:0 14px 30px -12px rgba(230,200,116,.5);transition:transform .12s}
  .big-btn:active{transform:scale(.98)}
  .ghost{display:block;width:100%;text-align:center;font-family:"Oswald";text-transform:uppercase;letter-spacing:.16em;
    font-weight:600;font-size:14px;color:var(--dim);background:var(--surf);border:1px solid var(--line);
    border-radius:14px;padding:15px;margin-top:11px}
  .ghost:active{border-color:var(--goldline)}
  .switch{display:block;margin:20px auto 0;color:var(--mut);font-size:12.5px;font-family:"Oswald";
    text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid transparent}
  .switch:active{color:var(--dim)}

  /* ---------- STATUS BAR ---------- */
  .statusbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    padding:max(10px,env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(180deg,rgba(10,16,32,.96),rgba(10,16,32,.82));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .sb-brand{font-family:"Oswald";text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--mut);font-weight:600}
  .sb-brand b{color:var(--gold);font-weight:700}
  .sb-live{display:flex;gap:12px;align-items:baseline}
  .sb-live .u{font-family:"Archivo";font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .sb-live .u small{font-family:"Oswald";font-size:9px;letter-spacing:.12em;color:var(--mut);font-weight:500;margin-left:3px;text-transform:uppercase}
  .sb-live .u.under{color:var(--under)} .sb-live .u.over{color:var(--over)}

  /* ---------- HOLE ---------- */
  #hole{padding:0}
  .holebody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 130px}
  .hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  .hhead .hno{font-family:"Oswald";font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:clamp(34px,10vw,44px);line-height:.9}
  .hhead .hmeta{text-align:right;font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;
    font-size:13px;color:var(--dim);font-weight:500;line-height:1.5}
  .hhead .hmeta b{color:var(--ivory);font-family:"Archivo";font-weight:800}
  .hazbar{display:flex;align-items:center;gap:8px;background:rgba(63,131,189,.13);border:1px solid rgba(63,131,189,.3);
    border-radius:11px;padding:9px 12px;font-size:12.5px;color:#bcd6ec;margin-bottom:15px}
  .hazbar .w{color:#8ec6ef;font-weight:700}
  .holemap{display:block;width:100%;height:172px;object-fit:cover;object-position:center;
    border-radius:14px;border:1px solid var(--line);margin-bottom:14px;background:#0b1226;cursor:zoom-in}
  .maphint{display:flex;justify-content:space-between;align-items:center;margin:-8px 2px 14px;
    font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mut)}
  .lightbox{position:fixed;inset:0;z-index:60;background:rgba(4,7,15,.95);display:none;
    align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:86vh;border-radius:12px;border:1px solid var(--line)}
  .lightbox .x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;font-family:"Oswald";
    font-size:22px;color:var(--ivory);width:44px;height:44px;border-radius:50%;background:var(--surf);
    border:1px solid var(--line);display:grid;place-items:center}

  /* decision block */
  .decide{background:linear-gradient(180deg,var(--raise),var(--surf2));border:1px solid var(--goldline);
    border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .decide::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0%,rgba(230,200,116,.08),transparent 70%);pointer-events:none}
  .d-eyebrow{color:var(--gold);font-size:12px}
  .d-club{font-family:"Archivo";font-weight:800;font-size:clamp(40px,13vw,56px);line-height:.95;
    letter-spacing:-.01em;margin:2px 0 3px;text-transform:uppercase}
  .teeopts{display:flex;flex-direction:column;margin:5px 0 2px}
  .teeopt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 15px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px}
  .teeopt.primary{background:rgba(230,200,116,.10);border-color:var(--goldline)}
  .teeopt b{font-family:"Archivo";font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
  .teeopt.primary b{color:var(--gold)}
  .teeopt span{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mut);white-space:nowrap}
  .oror{text-align:center;font-family:"Oswald";text-transform:uppercase;letter-spacing:.24em;font-size:10px;color:var(--mut);padding:8px 0}
  .d-why{font-size:13.5px;color:#e9dcbf;line-height:1.5;margin:11px 0 3px}
  .d-why .dm{color:var(--gold);font-size:9px;vertical-align:middle}
  .d-row{display:flex;gap:12px;margin-top:15px}
  .d-cell{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .d-cell .k{color:var(--mut);font-size:10.5px}
  .d-cell .v{font-weight:600;font-size:15px;margin-top:3px;line-height:1.3}
  .d-cell.miss .k{color:#e8a09b} .d-cell.miss .v{color:#f2c3bf}
  .d-appr{display:flex;align-items:center;gap:11px;margin-top:13px;padding-top:14px;border-top:1px solid var(--line)}
  .d-appr .k{color:var(--gold);font-size:11px;flex:0 0 auto}
  .d-appr .v{font-weight:600;font-size:15px}
  .missing{color:var(--mut);font-style:italic;font-weight:400}

  .whytoggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
    color:var(--dim);font-family:"Oswald";text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;font-weight:600;
    background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:14px}
  .whytoggle:active{border-color:var(--goldline)}
  .whytoggle .chev{transition:transform .25s}
  .whytoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .why{overflow:hidden;max-height:0;transition:max-height .32s ease}
  .why.open{max-height:640px}
  .why-in{padding-top:13px;display:flex;flex-direction:column;gap:11px}
  .beat{display:flex;gap:11px}
  .beat .bi{flex:0 0 20px;text-align:center;font-size:15px;line-height:1.35}
  .beat .bl{font-size:10px;color:var(--mut)}
  .beat.k .bl{color:var(--blue)} .beat.n .bl{color:var(--over)} .beat.d .bl{color:var(--under)}
  .beat .bt{font-size:14.5px;margin-top:1px}
  .beat.d .bt{color:var(--ivory);font-weight:600}

  /* score block */
  .scorewrap{margin-top:18px;background:linear-gradient(180deg,var(--surf),var(--surf2));
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px}
  .scorewrap .sh{text-align:center;color:var(--mut);font-size:11px;margin-bottom:12px}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .stepbtn{flex:0 0 68px;height:68px;border-radius:20px;background:var(--raise);border:1px solid var(--line);
    font-family:"Archivo";font-weight:800;font-size:34px;color:var(--gold);display:grid;place-items:center;line-height:1;
    transition:transform .1s,background .15s}
  .stepbtn:active{transform:scale(.92);background:#1c2748}
  .scoreval{flex:1;text-align:center}
  .scoreval .g{font-family:"Archivo";font-weight:800;font-size:64px;line-height:.9}
  .scoreval .rel{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--mut);margin-top:2px}
  .scoreval .rel.under{color:var(--under)} .scoreval .rel.over{color:var(--over)}
  .pts{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .pts .k{font-family:"Oswald";text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--mut)}
  .pts .v{font-family:"Archivo";font-weight:800;font-size:26px;color:var(--gold)}
  .pts .strk{font-size:11px;color:var(--mut);font-family:"Oswald";letter-spacing:.06em;text-transform:uppercase}
  .save{display:block;width:100%;margin-top:14px;text-align:center;font-family:"Oswald";text-transform:uppercase;
    letter-spacing:.16em;font-weight:700;font-size:16px;color:var(--ink0);
    background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:15px;padding:18px;
    box-shadow:0 12px 26px -12px rgba(230,200,116,.5);transition:transform .12s,background .2s}
  .save:active{transform:scale(.98)}
  .save.done{background:linear-gradient(180deg,var(--under),#3fa76e);color:#04140b}

  /* bottom nav */
  .botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(10,16,32,.98),rgba(10,16,32,.86));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .navbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:52px;border-radius:14px;
    background:var(--surf);border:1px solid var(--line);font-family:"Oswald";text-transform:uppercase;
    letter-spacing:.1em;font-size:12.5px;font-weight:600;color:var(--dim)}
  .navbtn:active{border-color:var(--goldline)} .navbtn[disabled]{opacity:.32}
  .navpos{flex:0 0 auto;text-align:center;font-family:"Archivo";font-weight:800;font-size:15px;min-width:56px;color:var(--ivory)}
  .navpos small{display:block;font-family:"Oswald";font-size:9px;letter-spacing:.14em;color:var(--mut);font-weight:500}

  /* ---------- SUMMARY ---------- */
  #summary{padding-top:max(46px,calc(env(safe-area-inset-top) + 26px));padding-bottom:40px}
  .rc{text-align:center;font-family:"Oswald";text-transform:uppercase;letter-spacing:.24em;color:var(--gold);font-size:13px;font-weight:600}
  .rc2{text-align:center;font-family:"Oswald";font-weight:700;font-size:clamp(30px,9vw,42px);margin:6px 0 4px}
  .rc3{text-align:center;color:var(--mut);font-size:13px;margin-bottom:22px}
  .totrow{display:flex;gap:11px;margin-bottom:11px}
  .tot{flex:1;background:linear-gradient(180deg,var(--surf),var(--surf2));border:1px solid var(--line);border-radius:15px;padding:16px 12px;text-align:center}
  .tot.hero{border-color:var(--goldline)}
  .tot .k{font-family:"Oswald";text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--mut)}
  .tot .v{font-family:"Archivo";font-weight:800;font-size:34px;margin-top:3px}
  .tot .v.gold{color:var(--gold)} .tot .v.under{color:var(--under)} .tot .v.over{color:var(--over)}
  .nine{display:flex;gap:11px;margin-bottom:22px}
  .nine .n9{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
  .nine .n9 .k{font-family:"Oswald";text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--mut)}
  .nine .n9 .v{font-family:"Archivo";font-weight:800;font-size:22px;margin-top:2px}
  .sctitle{font-family:"Oswald";text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--gold);margin:6px 0 12px;font-weight:600}
  .card-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .card-tbl th,.card-tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-family:"Archivo";font-weight:700;font-size:13px}
  .card-tbl th{font-family:"Oswald";font-weight:500;font-size:10px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
  .card-tbl td.hn{color:var(--mut);font-weight:600}
  .card-tbl .sc.u{color:var(--under)} .card-tbl .sc.o{color:var(--over)}
  .card-tbl tr.tot9 td{background:rgba(255,255,255,.03);color:var(--gold)}
  .missnote{background:rgba(63,131,189,.1);border:1px solid rgba(63,131,189,.26);border-radius:11px;
    padding:10px 13px;font-size:11.5px;color:#a9c4de;margin:18px 0 8px;line-height:1.6}
  /* ---------- POST-HOLE COACHING ---------- */
  .posthole{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#16213f,#0a1020 60%);
    padding:24px max(20px,env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom))}
  .posthole.on{display:flex}
  .ph-inner{max-width:560px;margin:0 auto;width:100%}
  .ph-hno{color:var(--under);font-size:12px;text-align:center;margin-bottom:12px}
  .ph-q{font-family:"Oswald";font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(24px,7vw,30px);text-align:center;margin-bottom:26px}
  .ph-opts{display:flex;flex-direction:column;gap:12px}
  .ph-opt{font-family:"Oswald";text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:19px;
    padding:21px;border-radius:15px;border:1px solid var(--line);background:var(--surf);color:var(--ivory);transition:transform .1s}
  .ph-opt:active{transform:scale(.98)}
  .ph-opt.godt{border-color:rgba(99,205,144,.45)} .ph-opt.okay{border-color:rgba(232,180,95,.45)} .ph-opt.daarligt{border-color:rgba(235,115,110,.5)}

  okay:"Tiger vandt sjældent ved at være spektakulær. Han vandt ved at fjerne de store fejl, hul efter hul, og lade modstanderen begå dem. Et okay hul er et fint hul. Du er stadig i din plan. Gentag din rutine på næste tee, ram dit target, og lad de små gode huller lægge sig oven på hinanden.",

  okay:"Jack vandt 18 majors, flere end nogen anden, næsten aldrig ved at være vild, men ved altid at spille det klogeste slag og undgå det store tal. Et okay hul passer perfekt ind i den plan. Bliv tålmodig, spil mod midten, og lad de svære huller passere uden skade.",
  daarligt:"Nicklaus lod aldrig ét hul rasle ham, og hemmeligheden var mental billeddannelse: 'jeg missede aldrig en putt i mit hoved.' Inden du slår næste slag, så SE det lykkes. Tydeligt, i detaljer, positivt. Og udfør så din plan uden tvivl. Et dårligt hul lever kun, hvis du bliver ved at spille det om i hovedet. Læg det væk, tegn det næste gode slag for dit indre blik, og gå roligt videre. Tvivl er bare et billede, du kan vælge at male om."},

/* ---------- state ---------- */
const LS_P="te_player", LS_R=id=>"te_round_"+id;
const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},
         set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},
         del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
const FORCED_PLAYER="mathias"; /* personlige links sætter denne til en spiller-id */
let player=null, scores=[], saved=[], moods=[], legseq=[], cur=0;
function makeLegSeq(){
  const deck=[];for(let k=0;k<LEGENDS.length;k++)deck.push(k,k);
  for(let tries=0;tries<300;tries++){
    for(let a=deck.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));const t=deck[a];deck[a]=deck[b];deck[b]=t;}
    let ok=true;for(let a=1;a<deck.length;a++)if(deck[a]===deck[a-1]){ok=false;break;}
    if(ok)return deck.slice();
  }
  return deck.slice();
}

function playHcp(index){const ch=index*RATING.slope/113+(RATING.cr-COURSE.par);return Math.round(ch*RATING.allowance);}
function strokesOn(index,idx){const h=playHcp(index);let s=0;if(h>=idx)s++;if(h>=idx+18)s++;return s;}
function loadRound(id){try{const r=JSON.parse(LS.get(LS_R(id)));if(r&&r.scores){scores=r.scores;saved=r.saved;moods=r.moods||HOLES.map(()=>null);legseq=(r.legseq&&r.legseq.length===18)?r.legseq:makeLegSeq();return;}}catch(e){}
  scores=HOLES.map(h=>h.par);saved=HOLES.map(()=>false);moods=HOLES.map(()=>null);legseq=makeLegSeq();}
function saveRound(){if(player)LS.set(LS_R(player.id),JSON.stringify({scores,saved,moods,legseq}));}
function points(i){const h=HOLES[i];const net=scores[i]-strokesOn(player.hcp,h.idx);const p=2+h.par-net;return p<0?0:p;}
function playedIdx(){return saved.map((s,i)=>s?i:-1).filter(i=>i>=0);}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}

/* ---------- start ---------- */
function renderStart(){
  const g=document.getElementById('pgrid');g.innerHTML='';
  PLAYERS.forEach(p=>{
    const hc=String(p.hcp).replace('.',',');
    const b=document.createElement('button');b.className='pcard';
    b.innerHTML=`<div class="pini ${p.tier}">${p.first[0]}</div>
      <div class="pname"><b>${p.name}</b><span>${ROLE[p.tier].t}</span></div>
      <div class="phcp">${hc}<small>HCP</small></div>`;
    b.onclick=()=>{choosePlayer(p.id,true);};
    g.appendChild(b);
  });
}
function choosePlayer(id,remember){
  player=PLAYERS.find(p=>p.id===id);if(!player)return;
  if(remember)LS.set(LS_P,id);
  loadRound(id);renderHome();show('home');
}

/* ---------- home ---------- */

  const el=document.getElementById('home');const r=ROLE[player.tier];
  const inProg=playedIdx().length>0 && playedIdx().length<18;
  const done=playedIdx().length===18;
  let live='';
  if(inProg||done){const pi=playedIdx();const gross=pi.reduce((a,i)=>a+scores[i],0);const par=pi.reduce((a,i)=>a+HOLES[i].par,0);
    const pts=pi.reduce((a,i)=>a+points(i),0);const rel=gross-par;
    live=`<div class="course"><div class="cstat"><div class="k">Thru</div><div class="v">${pi.length}</div></div>
      <div class="cstat"><div class="k">Mod par</div><div class="v ${rel<0?'':''}" style="color:${rel<0?'var(--under)':rel>0?'var(--over)':'var(--ivory)'}">${rel>0?'+'+rel:rel}</div></div>
      <div class="cstat"><div class="k">Point</div><div class="v" style="color:var(--gold)">${pts}</div></div></div>`;}
  el.innerHTML=`
    <div class="hi">God tur</div>
    <div class="hname">${player.first}</div>
    <span class="role ${r.c}">${r.t} · HCP ${String(player.hcp).replace('.',',')}</span>
    <div class="chcp">Banehcp · Skyrup (gul) · <b>${playHcp(player.hcp)} slag</b></div>
    <p class="rdesc">${RDESC[player.tier]}</p>
    ${live}
    <div class="manifesto">
      <h3>Sådan vinder vi Skåne</h3>
      <p>I dag spiller vi ikke otte runder golf. Vi spiller ÉN kamp. Som ét hold. Skyrup vinder man ikke med længde. Man vinder den ved at spille <b>banen</b>, ikke sit ego.</p>
      <ul>
        <li><b>Spil banen.</b> Hvert hul fortæller dig præcis, hvad der skal til: køllevalg, target og hvor du IKKE må gå. Følg det.</li>
        <li><b>Spil sammen.</b> Den, der lægger op og giver makkeren ro, vinder hullet. Helteslag taber matcher.</li>
        <li><b>Kend dine slag.</b> ${KEND[player.tier]}</li>
      </ul>
      <p class="kick">Én plan. Nul helteslag. Kom så. 🇪🇺</p>
    </div>
    <div style="margin-top:18px">
      ${done?`<button class="big-btn" id="goSum">SE ROUND SUMMARY</button>`
      :inProg?`<button class="big-btn" id="cont">FORTSÆT · HUL ${playedIdx().length+1}</button>
               <button class="ghost" id="restart">START FORFRA</button>`
      :`<button class="big-btn" id="startRound">START ROUND</button>`}
      ${player.id==='lasse'?'<button class="ghost" id="capBtn" style="margin-top:11px">⚑ Kaptajnens holdtavle</button>':''}
      ${FORCED_PLAYER?'':'<button class="switch" id="switchP">Skift spiller</button>'}
    </div>`;
  const q=id=>document.getElementById(id);
  if(q('capBtn'))q('capBtn').onclick=()=>{renderCaptain();show('captain');};
  if(q('startRound'))q('startRound').onclick=()=>{cur=0;openHole();};
  if(q('cont'))q('cont').onclick=()=>{cur=Math.min(playedIdx().length,17);openHole();};
  if(q('restart'))q('restart').onclick=()=>{if(confirm('Nulstil scoren og start forfra?')){scores=HOLES.map(h=>h.par);saved=HOLES.map(()=>false);saveRound();cur=0;openHole();}};
  if(q('goSum'))q('goSum').onclick=()=>renderSummary();
  if(q('switchP'))q('switchP').onclick=()=>{LS.del(LS_P);show('start');};
}

    relEl.className='rel lab '+(rel<0?'under':rel>0?'over':'');
    document.getElementById('pts').textContent=points(cur);
    document.getElementById('strk').textContent=strk===0?'· intet slag':strk===1?'· 1 slag':'· 2 slag';
  };
  upd();
  const q=id=>document.getElementById(id);
  q('minus').onclick=()=>{if(scores[cur]>1){scores[cur]--;upd();saveRound();markUnsaved();}};
  q('plus').onclick=()=>{if(scores[cur]<15){scores[cur]++;upd();saveRound();markUnsaved();}};
  function markUnsaved(){const b=q('saveBtn');b.classList.remove('done');b.innerHTML='GEM &amp; NÆSTE HUL';}
  q('whyBtn').onclick=()=>{const box=q('whyBox'),b=q('whyBtn');const open=box.classList.toggle('open');b.setAttribute('aria-expanded',open);};
  q('saveBtn').onclick=()=>{
    saved[cur]=true;saveRound();const b=q('saveBtn');b.classList.add('done');b.innerHTML='GEMT ✓';
    renderLive();
    setTimeout(()=>openPosthole(cur),240);
  };
}
document.getElementById('navprev').onclick=()=>{if(cur>0){cur--;openHole();}};
document.getElementById('navnext').onclick=()=>{if(cur<17){cur++;openHole();}else{renderSummary();}};

/* ---------- summary ---------- */
function renderSummary(){
  const pi=playedIdx();
  const front=[...Array(9).keys()], back=[...Array(9).keys()].map(i=>i+9);
  const sum=arr=>arr.reduce((a,i)=>({g:a.g+scores[i],p:a.p+HOLES[i].par,pt:a.pt+points(i)}),{g:0,p:0,pt:0});
  const F=sum(front),B=sum(back),T={g:F.g+B.g,p:F.p+B.p,pt:F.pt+B.pt};
  const rel=T.g-T.p;
  function nineTable(arr,title,tot){
    const cells=fn=>arr.map(fn).join('');
    return `<div class="sctitle" style="margin-top:16px">${title}</div>
    <div style="overflow-x:auto"><table class="card-tbl"><tbody>
      <tr><td class="hn">Hul</td>${cells(i=>`<td class="hn">${HOLES[i].n}</td>`)}<td class="hn">Σ</td></tr>
      <tr><td class="hn">Par</td>${cells(i=>`<td class="hn" style="color:var(--mut)">${HOLES[i].par}</td>`)}<td class="hn">${tot.p}</td></tr>
      <tr class="tot9"><td>Score</td>${cells(i=>{const r=scores[i]-HOLES[i].par;return `<td class="sc ${r<0?'u':r>0?'o':''}">${scores[i]}</td>`;})}<td>${tot.g}</td></tr>
      <tr><td class="hn">Pts</td>${cells(i=>`<td style="color:var(--gold)">${points(i)}</td>`)}<td style="color:var(--gold)">${tot.pt}</td></tr>
    </tbody></table></div>`;
  }
  document.getElementById('summary').innerHTML=`
    <div class="rc">Round Complete</div>
    <div class="rc2">${player.first} · Skyrup</div>
    <div class="rc3">${pi.length<18?pi.length+' huller spillet · ':''}Par ${COURSE.par} · gul tee</div>
    <div class="totrow">
      <div class="tot hero"><div class="k">Score</div><div class="v gold num">${T.g}</div></div>
      <div class="tot"><div class="k">Mod par</div><div class="v num ${rel<0?'under':rel>0?'over':''}">${rel>0?'+'+rel:rel===0?'E':rel}</div></div>
      <div class="tot hero"><div class="k">Stableford</div><div class="v gold num">${T.pt}</div></div>
    </div>
    <div class="nine">
      <div class="n9"><div class="k">Front 9</div><div class="v num">${F.g}</div></div>
      <div class="n9"><div class="k">Back 9</div><div class="v num">${B.g}</div></div>
    </div>
    ${nineTable(front,'Forsiden · 1 til 9',F)}
    ${nineTable(back,'Bagsiden · 10 til 18',B)}
    <div class="missnote">ⓘ Stableford er beregnet på dit <b>banehandicap</b> (Skyrup gul: CR 67,4 · slope 123 · par 71 → banehcp = hcp × slope/113 + (CR − par)). Bekræft tallene mod scorekortet/Golfbox. Sig til hvis de skal justeres. Farer og linjer er aflæst fra klubbens 18 hulkort.</div>
    <div style="margin-top:12px"><button class="ghost" id="backHome">← Tilbage til ${player.first}</button></div>`;
  document.getElementById('backHome').onclick=()=>{renderHome();show('home');};
  show('summary');
}

/* ---------- hole-map lightbox ---------- */
function openMap(n){var i=document.getElementById('lbimg');i.src='holes/'+n+'.jpg';document.getElementById('lightbox').classList.add('on');}
function closeMap(){document.getElementById('lightbox').classList.remove('on');}

/* ---------- efter hvert hul: hvordan gik det + coaching ---------- */
function openPosthole(i){
  const h=HOLES[i];
  document.getElementById('phInner').innerHTML=`
    <div class="ph-hno lab">Hul ${h.n} gemt ✓</div>
    <div class="ph-q">Hvordan gik hullet?</div>
    <div class="ph-opts">
      <button class="ph-opt godt" data-m="godt">🟢 Godt</button>
      <button class="ph-opt okay" data-m="okay">🟡 Okay</button>
      <button class="ph-opt daarligt" data-m="daarligt">🔴 Dårligt</button>
    </div>`;
  document.getElementById('posthole').classList.add('on');
  document.querySelectorAll('#phInner .ph-opt').forEach(b=>b.onclick=()=>pickMood(i,b.dataset.m));
}
let lastLegend=-1;
function pickMood(i,m){
  moods[i]=m; saveRound();
  let idx, second=false;
  if(legseq&&legseq.length===18&&legseq[i]!=null){idx=legseq[i];let c=0;for(let k=0;k<=i;k++)if(legseq[k]===idx)c++;second=c>=2;}
  else{do{idx=Math.floor(Math.random()*LEGENDS.length);}while(LEGENDS.length>1&&idx===lastLegend);}
  lastLegend=idx; const L=LEGENDS[idx], last=(i===17);
  const ini=L.n.split(' ').map(w=>w[0]).join('').slice(0,2);
  const slug=LEGPIC[L.n];
  const back=second?`<div class="ph-back">👋 Godt at se dig igen, ${player.first}. Det her er mit <b>andet og sidste råd</b> i dag. Så lyt godt efter. Du spiller med hovedet derude, og det er lige præcis sådan, man vinder en dyst som denne.</div>`:'';
  document.getElementById('phInner').innerHTML=`
    <div class="ph-coach ${m}">
      <div class="ph-legend">
        <div class="ph-crest">${slug?`<img src="legends/${slug}.jpg" alt="${L.n}" onerror="this.style.display='none'">`:''}<span class="cini">${ini}</span></div>
        <div class="ph-lmeta"><div class="ph-lname">${L.n}</div><div class="ph-lwon">🏆 ${WON[L.n]||''}</div></div>
        <div class="ph-mtag ${m}">${MLABEL[m]}</div>
      </div>
      ${back}
      <div class="ph-cc">${L[m]}</div>
    </div>
    <button class="ph-go" id="phGo">${last?'Se runden':'Videre til hul '+HOLES[i+1].n} →</button>`;
  document.getElementById('phGo').onclick=()=>{
    document.getElementById('posthole').classList.remove('on');
    if(last){renderSummary();} else {cur=i+1;openHole();}
  };
}

/* ---------- kaptajnens holdtavle ---------- */
let capData={eu:{},us:{}};
function loadCap(){try{const r=JSON.parse(LS.get("te_captain"));if(r&&r.eu)capData=r;}catch(e){}}
function saveCap(){LS.set("te_captain",JSON.stringify(capData));}
function roundPoints(pl){try{const r=JSON.parse(LS.get(LS_R(pl.id)));
  if(!r||!r.saved||r.saved.filter(Boolean).length<18)return null;
  let t=0;for(let i=0;i<18;i++){const net=r.scores[i]-strokesOn(pl.hcp,HOLES[i].idx);t+=Math.max(0,2+HOLES[i].par-net);}return t;
}catch(e){return null;}}
function capTotals(){const s=o=>Object.values(o).reduce((a,b)=>a+(+b||0),0);return {eu:s(capData.eu),us:s(capData.us)};}
function drawCapBoard(){const b=document.getElementById('capboard');if(!b)return;const {eu,us}=capTotals();
  b.innerHTML=`<div class="capside ${eu>us?'win':''}"><div class="flag">🇪🇺</div><div class="nm">Europa</div><div class="pts num">${eu}</div></div>
    <div class="capvs">VS</div>
    <div class="capside ${us>eu?'win':''}"><div class="flag">🇺🇸</div><div class="nm">USA</div><div class="pts num">${us}</div></div>`;}
function renderCaptain(){
  loadCap();
  PLAYERS.forEach(p=>{if(capData.eu[p.id]==null){const rp=roundPoints(p);if(rp!=null)capData.eu[p.id]=rp;}});
  const hc=v=>String(v).replace('.',',');
  const euRows=PLAYERS.map(p=>`<div class="caprow"><div class="ci eu">${p.first[0]}</div><div class="cnm">${p.name}<small>HCP ${hc(p.hcp)}</small></div><input type="number" inputmode="numeric" min="0" data-team="eu" data-id="${p.id}" value="${capData.eu[p.id]??''}" placeholder=", "></div>`).join('');
  const usRows=USA.map((p,i)=>`<div class="caprow"><div class="ci us">${p.n[0]}</div><div class="cnm">${p.n}<small>HCP ${hc(p.h)}</small></div><input type="number" inputmode="numeric" min="0" data-team="us" data-id="${i}" value="${capData.us[i]??''}" placeholder=", "></div>`).join('');
  document.getElementById('captain').innerHTML=`
    <div class="rc">Kaptajnens Holdtavle</div>
    <div class="rc3" style="margin-bottom:2px">Tast hver spillers stableford-point ind. Totalen regner sig selv</div>
    <div class="capboard" id="capboard"></div>
    <div class="capsec">🇪🇺 Team Europa</div>${euRows}
    <div class="capsec">🇺🇸 Team USA</div>${usRows}
    <div class="capnote">ⓘ Kun på din telefon (kaptajnens regnskab). Dine egne Europa-point fyldes ud automatisk, hvis din runde er gemt. Ret frit. Point tælles sammen, højeste total vinder.</div>
    <div style="margin-top:16px"><button class="ghost" id="capBack">← Tilbage</button></div>`;
  document.querySelectorAll('#captain input').forEach(inp=>{
    inp.oninput=()=>{const t=inp.dataset.team,id=inp.dataset.id,v=inp.value.trim();
      if(v==='')delete capData[t][id];else capData[t][id]=Math.max(0,parseInt(v,10)||0);
      saveCap();drawCapBoard();};
  });
  document.getElementById('capBack').onclick=()=>{renderHome();show('home');};
  drawCapBoard();
}

/* ---------- boot / routing ---------- */
function boot(){
  renderStart();
  if(FORCED_PLAYER && PLAYERS.some(p=>p.id===FORCED_PLAYER)){choosePlayer(FORCED_PLAYER,true);return;}
  const params=new URLSearchParams(location.search);
  const hash=location.hash.replace(/^#/,'');
  const hp=new URLSearchParams(hash.includes('=')?hash:('p='+hash));
  const deep=params.get('player')||params.get('p')||hp.get('player')||hp.get('p');
  if(deep && PLAYERS.some(p=>p.id===deep)){choosePlayer(deep,true);return;}
  const remembered=LS.get(LS_P);
  if(remembered && PLAYERS.some(p=>p.id===remembered)){choosePlayer(remembered,false);return;}
  show('start');
}
boot();
</script>
